name: Deploy DormLoop App to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '157.254.192.71' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME
          script: |
            set -e

            # 1. โฟลเดอร์สำหรับวางงาน (แยกเด็ดขาด ไม่ยุ่งกับ fitmate)
            PROJECT_DIR=~/friend-project
            mkdir -p $PROJECT_DIR/data
            cd $PROJECT_DIR

            # 2. เตรียมไฟล์ compose.yml สำหรับ dormloop-app
            cat << 'EOF' > compose.yml
            services:
              dormloop-app:
                container_name: dormloop-app
                image: ghcr.io/${{ github.repository }}:latest
                restart: unless-stopped
                ports:
                  - "127.0.0.1:3002:3000"
                environment:
                  - NODE_ENV=production
                  - PORT=3000
                  - DATABASE_URL=file:/app/server/prisma/data/dev.db
                  - JWT_SECRET=${{ secrets.JWT_SECRET || 'dormloop_super_secure_jwt_secret_change_me' }}
                volumes:
                  - ./data:/app/server/prisma/data
            EOF

            # 3. ล็อกอิน GHCR เพื่อดึง Image (กรณี Private Repo)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            # 4. ดึง Image ใหม่ล่าสุดและเริ่มรันระบบ
            echo "[+] Pulling latest Docker image..."
            docker compose pull dormloop-app

            echo "[+] Starting dormloop-app container..."
            docker compose up -d --remove-orphans dormloop-app

            # 5. ลบ cache image เก่าเพื่อประหยัดพื้นที่ดิสก์
            docker image prune -f

            echo "[✓] Deployment completed successfully! Container dormloop-app is running on 127.0.0.1:3002"
